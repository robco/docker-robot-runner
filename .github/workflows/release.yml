name: Publish Docker

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to dhi.io
        uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract tag
        id: meta
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build & push (base/api/web/all)
        run: |
          set -eu

          IMAGE="ghcr.io/${GITHUB_REPOSITORY}"
          VERSION="1.0"

          docker buildx build                                                         \
              --push                                                                  \
              --platform linux/amd64,linux/arm64                                      \
              --build-arg DHI_PYTHON_RUNTIME_TAG=3.12-alpine3.21                      \
              --build-arg DHI_PYTHON_BUILD_TAG=3.12-alpine3.21-dev                    \
              --build-arg REQUIREMENTS_SET=all                                        \
              -t "${IMAGE}:${{ steps.meta.outputs.version }}-${VERSION}"              \
              -t "${IMAGE}:${VERSION}"                                                \
              .
